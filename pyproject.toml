[project]
name = "yugioh-duel-engine"
version = "0.0.1"
description = "Yugioh duel engine (skeleton)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
  "basedpyright>=1.29.0",
  "hypothesis>=6.130.0",
]

[tool]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
