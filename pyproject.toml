[project]
name = "duel-master"
version = "0.0.1"
description = "Fresh architecture-first scaffold for duel-master"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12.0",
  "affairon @ file:///home/Joxos/source/affairon",
  "rich>=14.3.3",
]

[project.scripts]
duel-master = "duel_master.cli:main"

[tool.affairon]
local_plugins = []

[tool.affairon.profiles.duel]
local_plugins = [
  "duel_core.mr2020.rules",
  "duel_core.kernel.bridges",
]

[tool.affairon.profiles.kernel]
local_plugins = [
  "duel_core.kernel.planners",
  "duel_core.kernel.appliers",
  "duel_core.mr2020.actions",
  "duel_core.mr2020.planners",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
  "basedpyright>=1.29.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
